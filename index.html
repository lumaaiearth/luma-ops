<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LUMA Ops</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="theme-color" content="#080f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LUMA Ops" />
    <script>
      // Chrome/Android feuert 'beforeinstallprompt' teils, bevor React lädt.
      // Hier früh abfangen und merken, damit der Install-Hinweis es nicht verpasst.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__lumaInstallEvent = e
        window.dispatchEvent(new Event('luma-installable'))
      })

      // Nur die Karte (Leaflet) soll zoomen – nicht die ganze Seite.
      // iOS Safari ignoriert user-scalable=no, daher den Pinch-Zoom der Seite
      // (gesture*) global abfangen. Leaflet nutzt eigene Touch-Events und zoomt
      // weiterhin; Doppeltipp-Zoom unterbindet CSS via touch-action: manipulation.
      // So bleibt das UI (Buttons/Leisten) fix auf dem Schirm.
      ;['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
        document.addEventListener(ev, function (e) { e.preventDefault() }, { passive: false })
      })

      // WKWebView (Capacitor) lässt das Fenster nach Tastatur-Ein-/Ausblendung
      // teils verschoben stehen (sichtbar als Lücke unter der Bottom-Nav).
      // Zusätzlich zum fixierten body: Scroll-Offset nach jedem Viewport-
      // Resize bzw. Fokusverlust hart auf 0 zurücksetzen.
      function lumaResetScroll() {
        window.scrollTo(0, 0)
        document.documentElement.scrollTop = 0
        document.body.scrollTop = 0
      }
      if (window.visualViewport) window.visualViewport.addEventListener('resize', lumaResetScroll)
      window.addEventListener('focusout', function () { setTimeout(lumaResetScroll, 50) })
      // Standalone-App (Home-Bildschirm): Beim Zurückkehren aus dem App-Switcher
      // stellt iOS teils einen verschobenen Viewport wieder her, OHNE dass
      // resize/focusout feuern — die Lücke unter der Bottom-Nav bleibt dann
      // dauerhaft stehen. Deshalb auch beim Sichtbarwerden hart zurücksetzen.
      window.addEventListener('pageshow', function () { setTimeout(lumaResetScroll, 50) })
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) setTimeout(lumaResetScroll, 50)
      })
      window.addEventListener('orientationchange', function () { setTimeout(lumaResetScroll, 250) })
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <script>
      // Boot-Farben passend zum gespeicherten Theme (Standard: hell),
      // damit der Ladebildschirm nicht in der falschen Farbe aufblitzt.
      (function () {
        // Boot-Farben exakt aus den Theme-Werten (src/context/ThemeContext.jsx),
        // damit der Ladebildschirm nicht in einer anderen Farbe aufblitzt als
        // die App danach. Entfallene Theme-Ids zeigen auf ihren Nachfolger.
        var BOOT = {
          forest:   { bg: '#070d12', fg: '#f0f7fc', a: '#09BE60', dark: 1 },
          terminal: { bg: '#000000', fg: '#ffffff', a: '#00FF88', dark: 1 },
          light:    { bg: '#f4f5f6', fg: '#15181b', a: '#047A3C', dark: 0 },
          sand:     { bg: '#f8f5f0', fg: '#241c14', a: '#B4531F', dark: 0 },
        }
        var RETIRED = { navy: 'forest', ocean: 'forest', violet: 'forest', graphite: 'forest', sunset: 'forest', sky: 'light' }
        var t = 'light'
        try { t = localStorage.getItem('luma-theme') || 'light' } catch (e) {}
        var c = BOOT[t] || BOOT[RETIRED[t]] || BOOT.light
        var r = document.documentElement
        r.style.setProperty('--boot-bg', c.bg)
        r.style.setProperty('--boot-fg', c.fg)
        r.style.setProperty('--boot-a', c.a)
        r.style.setProperty('--boot-track', c.dark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.08)')
        document.addEventListener('DOMContentLoaded', function () {
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', c.bg)
        })
      })()
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      /* App-Shell fest an den Viewport pinnen: Die WKWebView (Capacitor) lässt das
         Fenster sonst nach Tastatur-Einblendung o.ä. „verrutscht" stehen — sichtbar
         als grauer Streifen unter der Bottom-Nav. Gescrollt wird nur innerhalb der
         App (.main-content), nie auf body-Ebene. */
      html { overflow: hidden; }
      /* Seiten ohne App-Shell (Login, Portal) scrollen im #root statt im body */
      #root { overflow-y: auto; -webkit-overflow-scrolling: touch; }
      body {
        position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none;
        font-family: 'Space Grotesk', sans-serif; background: var(--boot-bg, #eef0ec); color: var(--boot-fg, #0a1409); -webkit-font-smoothing: antialiased;
      }
      /* Scrollbars, Selects & Statusfarben sind theme-abhängig → src/styles/ui.css */
      button { font-family: inherit; }
      input, textarea, select { font-family: inherit; }

      /* ── LUMA Loading Screen ── */
      #luma-loader {
        position: fixed; inset: 0; z-index: 99999;
        background: var(--boot-bg, #eef0ec);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 0;
        transition: opacity 0.45s ease;
      }
      #luma-loader .ll-brand {
        font-family: 'Space Mono', monospace;
        font-size: 11px; color: var(--boot-a, #047A3C);
        letter-spacing: 0.22em; text-transform: uppercase;
        margin-bottom: 4px;
      }
      #luma-loader .ll-ops {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 32px; font-weight: 300; color: var(--boot-fg, #0a1409);
        letter-spacing: -0.03em; margin-bottom: 44px;
      }
      #luma-loader .ll-track {
        width: 180px; height: 3px;
        background: var(--boot-track, rgba(0,0,0,0.08));
        border-radius: 2px; overflow: hidden;
      }
      #luma-loader .ll-fill {
        height: 100%; width: 0%;
        background: var(--boot-a, #047A3C);
        border-radius: 2px;
        box-shadow: 0 0 10px color-mix(in srgb, var(--boot-a, #047A3C) 45%, transparent);
        animation: ll-progress 1.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        transition: width 0.3s ease;
      }
      @keyframes ll-progress {
        0%   { width: 0% }
        25%  { width: 40% }
        55%  { width: 65% }
        80%  { width: 82% }
        100% { width: 91% }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="luma-loader">
      <div class="ll-brand">LUMA</div>
      <div class="ll-ops">Ops</div>
      <div class="ll-track">
        <div class="ll-fill" id="ll-fill"></div>
      </div>
    </div>

    <script>
      (function(l){if(l.search[1]==='p'){var d=decodeURIComponent(l.search.slice(3));window.history.replaceState(null,null,d+(l.search.indexOf('h=')>-1?decodeURIComponent(l.search.split('h=')[1]):'')+l.hash)}}(window.location));
    </script>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
