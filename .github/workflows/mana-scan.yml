name: MANA Radar Scan

on:
  schedule:
    - cron: '30 4 * * *'   # täglich ~06:30 deutscher Zeit (Sommerzeit)
  workflow_dispatch:
    inputs:
      day:
        description: 'Tag (YYYY-MM-DD), leer = gestern'
        required: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Anthropic SDK
        run: npm i --no-save @anthropic-ai/sdk

      - name: Run MANA scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_DAY: ${{ github.event.inputs.day }}
        run: |
          # Fehlende Secrets sind ein Fehler. Früher wurde still übersprungen und
          # „success" gemeldet — dadurch blieb monatelang unbemerkt, dass MANA nie lief.
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::MANA-Scan nicht möglich — ANTHROPIC_API_KEY/SUPABASE_SERVICE_KEY fehlen (Repo → Settings → Secrets → Actions)."
            exit 1
          fi
          if [ -n "$INPUT_DAY" ]; then
            node scripts/mana-scan.mjs --day="$INPUT_DAY"
          else
            node scripts/mana-scan.mjs
          fi
