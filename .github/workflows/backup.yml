name: Supabase Backup

# Vollständige Sicherung der Produktionsdatenbank mit pg_dump.
#
# Die frühere Fassung exportierte Tabellen über die REST-API mit dem
# öffentlichen anon-Key. Die RLS hat jede Zeile abgewiesen — jedes Backup
# enthielt 0 Zeilen und meldete trotzdem Erfolg.
#
# Jetzt:
#   · pg_dump über SUPABASE_DB_URL (Connection String mit Passwort)
#   · Schemata public, auth, storage, supabase_migrations (Struktur + Daten)
#   · symmetrisch verschlüsselt mit BACKUP_PASSPHRASE, bevor es als Artefakt
#     abgelegt wird — Artefakte sind für alle mit Lesezugriff aufs Repo
#     herunterladbar
#   · schlägt fehl, wenn ein Secret fehlt oder der Dump verdächtig klein ist
#
# Wiederherstellen:
#   gpg --decrypt luma-<datum>.dump.gpg > luma.dump
#   pg_restore --no-owner --no-privileges -d <ziel-db> luma.dump

on:
  schedule:
    - cron: '17 2 * * *'   # täglich ~04:17 Uhr Berlin
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Secrets prüfen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          fehlt=""
          [ -n "$SUPABASE_DB_URL" ]   || fehlt="$fehlt SUPABASE_DB_URL"
          [ -n "$BACKUP_PASSPHRASE" ] || fehlt="$fehlt BACKUP_PASSPHRASE"
          if [ -n "$fehlt" ]; then
            echo "::error::Backup nicht möglich, Secrets fehlen:$fehlt (Repo → Settings → Secrets → Actions)"
            exit 1
          fi

      - name: PostgreSQL-17-Client installieren
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump erstellen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage --schema=supabase_migrations \
            --file="luma-$DATE.dump"
          GROESSE=$(stat -c %s "luma-$DATE.dump")
          echo "Dumpgröße: $GROESSE Bytes"
          # Ein leerer oder fast leerer Dump ist ein Fehler, kein Backup.
          if [ "$GROESSE" -lt 100000 ]; then
            echo "::error::Dump ist nur $GROESSE Bytes groß — das ist kein vollständiges Backup."
            exit 1
          fi
          # Stichprobe: die wichtigsten Tabellen müssen Daten enthalten.
          /usr/lib/postgresql/17/bin/pg_restore --list "luma-$DATE.dump" > inhalt.txt
          for T in clients projects time_entries pflege_plaene tasks; do
            grep -q "TABLE DATA public $T " inhalt.txt || { echo "::error::Tabelle $T fehlt im Dump"; exit 1; }
          done
          echo "Tabellen mit Daten: $(grep -c 'TABLE DATA' inhalt.txt)"

      - name: Verschlüsseln
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 \
              --output "luma-$DATE.dump.gpg" "luma-$DATE.dump" <<< "$BACKUP_PASSPHRASE"
          shred -u "luma-$DATE.dump"
          ls -l "luma-$DATE.dump.gpg"

      - name: Als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.DATE }}
          path: luma-${{ env.DATE }}.dump.gpg
          retention-days: 90
          if-no-files-found: error
